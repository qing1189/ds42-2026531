<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DeepSeek-2API 测试</title>
<style>
:root {
  --bg: #1a1a2e;
  --surface: #16213e;
  --border: #0f3460;
  --text: #e0e0e0;
  --text-dim: #8892a0;
  --green: #00e676;
  --yellow: #ffd600;
  --red: #ff1744;
  --accent: #00b0ff;
  --thinking: #bb86fc;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  background: var(--bg);
  color: var(--text);
  line-height: 1.6;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
}
.container {
  max-width: 1000px;
  margin: 0 auto;
  padding: 20px;
  flex: 1;
  display: flex;
  flex-direction: column;
  width: 100%;
}
header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 12px 20px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 8px;
  margin-bottom: 16px;
}
header h1 {
  font-size: 1.2em;
  color: var(--accent);
}
header .nav-links {
  display: flex;
  gap: 12px;
  font-size: 0.85em;
}
header .nav-links a {
  color: var(--text-dim);
  text-decoration: none;
}
header .nav-links a:hover { color: var(--accent); }

.config-bar {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 12px 16px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 8px;
  margin-bottom: 16px;
  flex-wrap: wrap;
}
.config-bar label {
  font-size: 0.82em;
  color: var(--text-dim);
  white-space: nowrap;
}
.config-bar select,
.config-bar input {
  background: var(--bg);
  color: var(--text);
  border: 1px solid var(--border);
  border-radius: 4px;
  padding: 6px 10px;
  font-size: 0.85em;
}
.config-bar select:focus,
.config-bar input:focus {
  outline: none;
  border-color: var(--accent);
}
.config-bar .api-key-input {
  flex: 1;
  min-width: 180px;
}
.config-bar .toggle-group {
  display: flex;
  align-items: center;
  gap: 6px;
}
.config-bar .toggle-group input[type="checkbox"] {
  width: 16px;
  height: 16px;
  accent-color: var(--accent);
}

.chat-area {
  flex: 1;
  display: flex;
  flex-direction: column;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 8px;
  overflow: hidden;
  min-height: 400px;
}

.messages {
  flex: 1;
  overflow-y: auto;
  padding: 16px;
  display: flex;
  flex-direction: column;
  gap: 12px;
}

.message {
  max-width: 85%;
  padding: 10px 14px;
  border-radius: 8px;
  font-size: 0.92em;
  word-wrap: break-word;
  white-space: pre-wrap;
}
.message.user {
  align-self: flex-end;
  background: var(--accent);
  color: #fff;
  border-bottom-right-radius: 2px;
}
.message.assistant {
  align-self: flex-start;
  background: var(--bg);
  border: 1px solid var(--border);
  border-bottom-left-radius: 2px;
}
.message.assistant .thinking {
  color: var(--thinking);
  font-size: 0.88em;
  border-left: 2px solid var(--thinking);
  padding-left: 10px;
  margin-bottom: 8px;
  opacity: 0.85;
}
.message.assistant .thinking-label {
  font-size: 0.78em;
  color: var(--thinking);
  opacity: 0.7;
  margin-bottom: 4px;
}
.message.error {
  align-self: center;
  background: rgba(255, 23, 68, 0.15);
  border: 1px solid var(--red);
  color: var(--red);
  font-size: 0.85em;
}
.message.system-msg {
  align-self: center;
  background: rgba(0, 176, 255, 0.1);
  border: 1px solid var(--border);
  color: var(--text-dim);
  font-size: 0.82em;
  padding: 6px 12px;
}

.typing-indicator {
  display: none;
  align-self: flex-start;
  padding: 10px 14px;
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: 8px;
  font-size: 0.85em;
  color: var(--text-dim);
}
.typing-indicator.active { display: block; }
.typing-indicator .dots {
  display: inline-block;
  animation: blink 1.4s infinite;
}
@keyframes blink {
  0%, 20% { opacity: 1; }
  50% { opacity: 0.3; }
  80%, 100% { opacity: 1; }
}

.input-area {
  display: flex;
  gap: 8px;
  padding: 12px 16px;
  border-top: 1px solid var(--border);
  background: var(--surface);
}
.input-area textarea {
  flex: 1;
  background: var(--bg);
  color: var(--text);
  border: 1px solid var(--border);
  border-radius: 6px;
  padding: 10px 12px;
  font-size: 0.92em;
  font-family: inherit;
  resize: none;
  min-height: 44px;
  max-height: 150px;
  line-height: 1.4;
}
.input-area textarea:focus {
  outline: none;
  border-color: var(--accent);
}
.input-area button {
  padding: 8px 20px;
  background: var(--accent);
  color: #fff;
  border: none;
  border-radius: 6px;
  font-size: 0.9em;
  cursor: pointer;
  white-space: nowrap;
  align-self: flex-end;
}
.input-area button:hover { opacity: 0.85; }
.input-area button:disabled {
  opacity: 0.5;
  cursor: not-allowed;
}
.input-area button.stop-btn {
  background: var(--red);
}

.status-bar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 6px 16px;
  font-size: 0.78em;
  color: var(--text-dim);
  border-top: 1px solid var(--border);
}
.status-bar .metrics {
  display: flex;
  gap: 16px;
}
.clear-btn {
  background: none;
  border: 1px solid var(--border);
  color: var(--text-dim);
  border-radius: 4px;
  padding: 3px 10px;
  font-size: 0.82em;
  cursor: pointer;
}
.clear-btn:hover { border-color: var(--red); color: var(--red); }
</style>
</head>
<body>
<div class="container">
  <header>
    <h1>API 测试</h1>
    <div class="nav-links">
      <a href="/admin">管理面板</a>
      <a href="/performance">性能监控</a>
    </div>
  </header>

  <!-- Configuration -->
  <div class="config-bar">
    <label>模型:</label>
    <select id="modelSelect">
      <option value="deepseek-v4-flash">deepseek-v4-flash (默认/免费)</option>
      <option value="deepseek-v4-pro">deepseek-v4-pro (深度思考)</option>
      <option value="deepseek-v4-vision">deepseek-v4-vision (视觉)</option>
    </select>
    <label>API Key:</label>
    <input type="password" id="apiKeyInput" class="api-key-input" placeholder="留空则不鉴权">
    <div class="toggle-group">
      <input type="checkbox" id="streamToggle" checked>
      <label for="streamToggle">流式</label>
    </div>
    <div class="toggle-group">
      <input type="checkbox" id="thinkingToggle" checked>
      <label for="thinkingToggle">思考</label>
    </div>
    <div class="toggle-group">
      <input type="checkbox" id="searchToggle" checked>
      <label for="searchToggle">搜索</label>
    </div>
  </div>

  <!-- Chat Area -->
  <div class="chat-area">
    <div class="messages" id="messages">
      <div class="message system-msg">输入消息开始测试 API，支持流式和非流式模式。</div>
    </div>
    <div class="typing-indicator" id="typing">
      正在生成<span class="dots">...</span>
    </div>
    <div class="input-area">
      <textarea id="userInput" placeholder="输入消息... (Enter 发送, Shift+Enter 换行)" rows="1"></textarea>
      <button id="sendBtn">发送</button>
      <button id="stopBtn" class="stop-btn" style="display:none">停止</button>
    </div>
    <div class="status-bar">
      <div class="metrics">
        <span id="metricTTFB">TTFB: -</span>
        <span id="metricTokens">Tokens: -</span>
        <span id="metricDuration">耗时: -</span>
      </div>
      <button class="clear-btn" id="clearBtn">清空对话</button>
    </div>
  </div>
</div>

<script>
const $ = id => document.getElementById(id);
let abortController = null;
let isGenerating = false;

// Auto-resize textarea
const textarea = $('userInput');
textarea.addEventListener('input', () => {
  textarea.style.height = 'auto';
  textarea.style.height = Math.min(textarea.scrollHeight, 150) + 'px';
});

// Enter to send, Shift+Enter for newline
textarea.addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    if (!isGenerating) sendMessage();
  }
});

$('sendBtn').addEventListener('click', sendMessage);
$('stopBtn').addEventListener('click', stopGeneration);
$('clearBtn').addEventListener('click', clearChat);

function clearChat() {
  $('messages').innerHTML = '<div class="message system-msg">对话已清空。输入消息开始新的测试。</div>';
  resetMetrics();
}

function resetMetrics() {
  $('metricTTFB').textContent = 'TTFB: -';
  $('metricTokens').textContent = 'Tokens: -';
  $('metricDuration').textContent = '耗时: -';
}

function addMessage(role, content, thinkingContent) {
  const div = document.createElement('div');
  div.className = `message ${role}`;
  if (role === 'assistant' && thinkingContent) {
    div.innerHTML = `<div class="thinking-label">思考过程</div><div class="thinking">${escapeHtml(thinkingContent)}</div>${escapeHtml(content)}`;
  } else {
    div.textContent = content;
  }
  $('messages').appendChild(div);
  scrollToBottom();
  return div;
}

function addErrorMessage(msg) {
  const div = document.createElement('div');
  div.className = 'message error';
  div.textContent = msg;
  $('messages').appendChild(div);
  scrollToBottom();
}

function scrollToBottom() {
  const msgs = $('messages');
  msgs.scrollTop = msgs.scrollHeight;
}

function escapeHtml(str) {
  return str.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}

function setGenerating(val) {
  isGenerating = val;
  $('sendBtn').style.display = val ? 'none' : 'block';
  $('stopBtn').style.display = val ? 'block' : 'none';
  $('sendBtn').disabled = val;
  $('userInput').disabled = val;
  $('typing').classList.toggle('active', val);
}

function stopGeneration() {
  if (abortController) {
    abortController.abort();
    abortController = null;
  }
  setGenerating(false);
}

async function sendMessage() {
  const text = textarea.value.trim();
  if (!text) return;

  textarea.value = '';
  textarea.style.height = 'auto';
  resetMetrics();

  addMessage('user', text);

  const model = $('modelSelect').value;
  const apiKey = $('apiKeyInput').value.trim();
  const stream = $('streamToggle').checked;
  const thinkingEnabled = $('thinkingToggle').checked;
  const searchEnabled = $('searchToggle').checked;

  const headers = { 'Content-Type': 'application/json' };
  if (apiKey) headers['Authorization'] = `Bearer ${apiKey}`;

  const body = {
    model,
    messages: [{ role: 'user', content: text }],
    stream,
    thinking_enabled: thinkingEnabled,
    search_enabled: searchEnabled,
  };

  abortController = new AbortController();
  setGenerating(true);

  const startTime = performance.now();
  let firstChunkTime = null;
  let totalTokens = 0;

  try {
    const res = await fetch('/v1/chat/completions', {
      method: 'POST',
      headers,
      body: JSON.stringify(body),
      signal: abortController.signal,
    });

    if (!res.ok) {
      const errData = await res.json().catch(() => ({ error: { message: `HTTP ${res.status}` } }));
      throw new Error(errData.error?.message || `请求失败 (${res.status})`);
    }

    if (stream) {
      await handleStreamResponse(res, startTime);
    } else {
      await handleNonStreamResponse(res, startTime);
    }
  } catch (err) {
    if (err.name === 'AbortError') {
      addErrorMessage('生成已停止');
    } else {
      addErrorMessage(`错误: ${err.message}`);
    }
  } finally {
    setGenerating(false);
    abortController = null;
  }
}

async function handleStreamResponse(res, startTime) {
  const reader = res.body.getReader();
  const decoder = new TextDecoder();
  let buffer = '';
  let content = '';
  let thinking = '';
  let firstChunkTime = null;
  let msgDiv = null;

  try {
    while (true) {
      const { done, value } = await reader.read();
      if (done) break;

      buffer += decoder.decode(value, { stream: true });
      const lines = buffer.split('\n');
      buffer = lines.pop() || '';

      for (const line of lines) {
        if (!line.startsWith('data: ')) continue;
        const data = line.slice(6).trim();
        if (data === '[DONE]') continue;
        if (!data) continue;

        try {
          const parsed = JSON.parse(data);
          const delta = parsed.choices?.[0]?.delta;
          if (!delta) continue;

          if (!firstChunkTime) {
            firstChunkTime = performance.now();
            $('metricTTFB').textContent = `TTFB: ${Math.round(firstChunkTime - startTime)}ms`;
          }

          if (delta.reasoning_content) {
            thinking += delta.reasoning_content;
          }
          if (delta.content) {
            content += delta.content;
          }

          // Update displayed message
          if (content || thinking) {
            if (!msgDiv) {
              msgDiv = document.createElement('div');
              msgDiv.className = 'message assistant';
              $('messages').appendChild(msgDiv);
            }
            let html = '';
            if (thinking) {
              html += `<div class="thinking-label">思考过程</div><div class="thinking">${escapeHtml(thinking)}</div>`;
            }
            if (content) {
              html += escapeHtml(content);
            }
            msgDiv.innerHTML = html;
            scrollToBottom();
          }

          // Check finish
          if (parsed.choices?.[0]?.finish_reason === 'stop') {
            const duration = performance.now() - startTime;
            $('metricDuration').textContent = `耗时: ${(duration / 1000).toFixed(2)}s`;
          }

          // Usage from parsed (some implementations include it)
          if (parsed.usage) {
            totalTokens = parsed.usage.total_tokens || parsed.usage.completion_tokens || 0;
            $('metricTokens').textContent = `Tokens: ${totalTokens}`;
          }
        } catch {
          // skip unparseable
        }
      }
    }
  } finally {
    reader.releaseLock();
  }

  if (!msgDiv && !content && !thinking) {
    addErrorMessage('未收到任何响应内容');
  }

  const duration = performance.now() - startTime;
  $('metricDuration').textContent = `耗时: ${(duration / 1000).toFixed(2)}s`;
}

async function handleNonStreamResponse(res, startTime) {
  const data = await res.json();
  const duration = performance.now() - startTime;

  $('metricTTFB').textContent = `TTFB: ${Math.round(duration)}ms`;
  $('metricDuration').textContent = `耗时: ${(duration / 1000).toFixed(2)}s`;

  if (data.usage) {
    const tokens = data.usage.total_tokens || data.usage.completion_tokens || 0;
    $('metricTokens').textContent = `Tokens: ${tokens}`;
  }

  const choice = data.choices?.[0];
  if (choice?.message) {
    const content = choice.message.content || '';
    const reasoning = choice.message.reasoning_content || '';
    addMessage('assistant', content, reasoning);
  } else {
    addErrorMessage('响应格式异常: ' + JSON.stringify(data).slice(0, 200));
  }
}

// Persist API key in sessionStorage
const savedKey = sessionStorage.getItem('playground_api_key');
if (savedKey) $('apiKeyInput').value = savedKey;
$('apiKeyInput').addEventListener('change', () => {
  sessionStorage.setItem('playground_api_key', $('apiKeyInput').value);
});
</script>
</body>
</html>
