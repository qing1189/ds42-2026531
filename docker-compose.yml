services:
  deepseek-2api:
    build:
      context: .
      dockerfile: Dockerfile
    image: deepseek-2api:latest
    container_name: deepseek-2api
    restart: unless-stopped

    # Read configuration (DS_TOKEN / DS_TOKENS / DS_ACCOUNTS / API_KEY ...) from .env.
    # Copy .env.example to .env and fill it in before starting.
    env_file:
      - .env

    environment:
      # Override the hardcoded default log path so logs land in the mounted volume.
      LOG_DIR: /app/logs
      # JSON config persistence directory (mounted volume).
      DATA_DIR: /app/data
      PORT: 3000

    ports:
      - "${PORT:-3000}:3000"

    volumes:
      # Persist request/chat logs on the host.
      - ./logs:/app/logs
      # Persist all configuration (tokens, accounts, API keys, proxy, scheduler, etc.) as JSON.
      - ./data:/app/data

    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/').then(()=>process.exit(0)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
